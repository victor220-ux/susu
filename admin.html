<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NEXORA Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./admin.js"></script>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <div id="app">
      <main class="login">
        <section class="panel">
          <div class="brand"><span class="mark">N</span>NEXORA Studio</div>
          <h1>Admin access</h1>
          <p class="muted">Sign in to manage project enquiries.</p>
          <label>Email</label
          ><input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="admin@example.com"
          />
          <label>Password</label
          ><input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Your password"
          />
          <button id="signinBtn" class="btn primary" type="button">
            Sign in
          </button>
          <div id="err" class="error"></div>
        </section>
      </main>
    </div>
  </body>
</html>
